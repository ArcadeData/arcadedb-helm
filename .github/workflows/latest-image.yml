name: CI - Latest Image Guard

# Pre-release guard: exercises the chart against the rolling `latest` ArcadeDB
# image so regressions in the upcoming release surface before it ships.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC (matches Dependabot cadence)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-latest:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      imageTag: latest
      pullPolicy: Always

  integration-latest-native:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      imageTag: latest-native
      pullPolicy: Always
      flavor: native

  # HA with a user-supplied root password Secret and no cluster token on an image
  # >= 26.11.1 (issue #56): those servers derive the cluster token from the
  # password file (ArcadeData/arcadedb#10479), so the chart mounts rootPasswordPath
  # only. `latest` carries no version the chart can compare, so the job names the
  # 26.11.1 snapshot tag, which it does. Once 26.11.1 is released, pin this job to
  # it in lint.yml next to integration-root-password-env.
  integration-root-password-file-snapshot:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      imageTag: 26.11.1-SNAPSHOT
      pullPolicy: Always
      rootPasswordSecret: arcadedb-root-password
      rootPasswordFrom: file

  # Gremlin on a non-default port through writePortToConfig (issue #62): the
  # plugin reads its port only from gremlin-server.yaml, a server-side behaviour
  # the upcoming release could change.
  integration-latest-gremlin-port:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      imageTag: latest
      pullPolicy: Always
      replicaCount: 1
      gremlinPort: 8183

  config-keys-latest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4

      - name: Rendered -Darcadedb.* keys exist in the latest image
        env:
          IMAGE_TAG: latest
        run: make test-config-keys
