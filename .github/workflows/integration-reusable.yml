name: Integration (reusable)

on:
  workflow_call:
    inputs:
      imageTag:
        description: "Image tag to test. Empty string defaults to chart appVersion."
        type: string
        default: ""
      pullPolicy:
        description: "Image pull policy (IfNotPresent for pinned, Always for rolling tags)."
        type: string
        default: "IfNotPresent"
      flavor:
        description: "image.flavor to install (jvm or native)."
        type: string
        default: "jvm"
      rootPasswordSecret:
        description: >-
          Name of a root password Secret to create and install with
          (arcadedb.credentials.rootPassword.secret.name). Empty = the
          chart-generated arcadedb-credentials-secret.
        type: string
        default: ""
      rootPasswordFrom:
        description: >-
          How the chart must hand the root password to the server: file
          (rootPasswordPath) or env (the pre-26.11.1 HA fallback, issue #45).
        type: string
        default: "file"
      clusterTokenSecret:
        description: >-
          Name of an HA cluster token Secret to create and install with
          (arcadedb.credentials.clusterToken.secret.name), key clusterToken.
          Empty = none, or the generated key in arcadedb-credentials-secret
          when rootPasswordSecret is empty too.
        type: string
        default: ""
      replicaCount:
        description: >-
          replicaCount to install. 1 = a single node (no HA, no cluster token);
          the suite then skips its Raft phases.
        type: number
        default: 3
      gremlinPort:
        description: >-
          0 = Gremlin off. Otherwise install with the Gremlin plugin on this port,
          by the route gremlinPortRoute names, and run that route's suite after the
          main one. Needs replicaCount 1 and the jvm flavor.
        type: number
        default: 0
      gremlinPortRoute:
        description: >-
          How gremlinPort reaches the plugin. write = the chart writes it into
          gremlin-server.yaml (arcadedb.plugins.gremlin.writePortToConfig, issue
          #62); make test-integration-gremlin then moves it to gremlinPort + 1 with
          helm upgrade. external = the user's own gremlin-server.yaml sets it
          (arcadedb.plugins.gremlin.portManagedExternally, issue #66); make
          test-integration-gremlin-external writes that file on the config volume,
          restarts the pod, then mounts one from a ConfigMap on gremlinPort + 1.
        type: string
        default: "write"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kind
        run: |
          curl -sLo /tmp/kind-linux-amd64 \
            https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          curl -sLo /tmp/kind.sha256 \
            https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64.sha256sum
          (cd /tmp && sha256sum -c kind.sha256)
          install -m 0755 /tmp/kind-linux-amd64 /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -sLo /tmp/kubectl \
            "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          curl -sLo /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4

      - name: Log image digest under test
        if: inputs.imageTag != ''
        run: |
          echo "Testing image arcadedata/arcadedb:${{ inputs.imageTag }} (flavor ${{ inputs.flavor }})"
          docker buildx imagetools inspect "arcadedata/arcadedb:${{ inputs.imageTag }}" || true

      - name: Create kind cluster
        run: kind create cluster --wait 60s

      - name: Create root password Secret
        if: inputs.rootPasswordSecret != ''
        env:
          SECRET_NAME: ${{ inputs.rootPasswordSecret }}
        run: |
          kubectl create secret generic "$SECRET_NAME" \
            --from-literal=password="$(openssl rand -hex 16)"

      - name: Create cluster token Secret
        if: inputs.clusterTokenSecret != ''
        env:
          SECRET_NAME: ${{ inputs.clusterTokenSecret }}
        run: |
          kubectl create secret generic "$SECRET_NAME" \
            --from-literal=clusterToken="$(openssl rand -hex 32)"

      - name: Install chart
        env:
          SECRET_NAME: ${{ inputs.rootPasswordSecret }}
          TOKEN_SECRET_NAME: ${{ inputs.clusterTokenSecret }}
          GREMLIN_PORT_ROUTE: ${{ inputs.gremlinPortRoute }}
        run: |
          CREDENTIALS_ARGS=()
          if [[ -n "$SECRET_NAME" ]]; then
            # A user-supplied root password Secret makes the dedicated cluster
            # token opt-in: it is mounted only when clusterTokenSecret is set.
            CREDENTIALS_ARGS+=(
              --set-string arcadedb.credentials.rootPassword.secret.name="$SECRET_NAME"
              --set-string arcadedb.credentials.rootPassword.secret.key=password
            )
          fi
          if [[ -n "$TOKEN_SECRET_NAME" ]]; then
            CREDENTIALS_ARGS+=(
              --set-string arcadedb.credentials.clusterToken.secret.name="$TOKEN_SECRET_NAME"
              --set-string arcadedb.credentials.clusterToken.secret.key=clusterToken
            )
          fi
          GREMLIN_ARGS=()
          if [[ "${{ inputs.gremlinPort }}" != "0" ]]; then
            case "$GREMLIN_PORT_ROUTE" in
              write)    GREMLIN_ROUTE_KEY=writePortToConfig ;;
              external) GREMLIN_ROUTE_KEY=portManagedExternally ;;
              *) echo "gremlinPortRoute must be write or external (got '${GREMLIN_PORT_ROUTE}')"; exit 1 ;;
            esac
            GREMLIN_ARGS+=(
              --set arcadedb.plugins.gremlin.enabled=true
              --set arcadedb.plugins.gremlin.port=${{ inputs.gremlinPort }}
              --set "arcadedb.plugins.gremlin.${GREMLIN_ROUTE_KEY}=true"
            )
          fi
          helm install test-arcadedb charts/arcadedb/ \
            --set replicaCount=${{ inputs.replicaCount }} \
            --set arcadedb.defaultDatabases="" \
            --set image.tag="${{ inputs.imageTag }}" \
            --set image.pullPolicy="${{ inputs.pullPolicy }}" \
            --set image.flavor="${{ inputs.flavor }}" \
            "${CREDENTIALS_ARGS[@]}" \
            "${GREMLIN_ARGS[@]}" \
            --timeout 5m \
            --wait

      - name: Run integration tests
        env:
          IMAGE_FLAVOR: ${{ inputs.flavor }}
          ROOT_PASSWORD_SECRET: ${{ inputs.rootPasswordSecret }}
          ROOT_PASSWORD_KEY: ${{ inputs.rootPasswordSecret != '' && 'password' || '' }}
          ROOT_PASSWORD_FROM: ${{ inputs.rootPasswordFrom }}
          CLUSTER_TOKEN_SECRET: ${{ inputs.clusterTokenSecret }}
          CLUSTER_TOKEN_KEY: ${{ inputs.clusterTokenSecret != '' && 'clusterToken' || '' }}
          REPLICAS: ${{ inputs.replicaCount }}
        run: make test-integration

      - name: Run Gremlin port tests
        if: inputs.gremlinPort != 0 && inputs.gremlinPortRoute == 'write'
        env:
          GREMLIN_PORT: ${{ inputs.gremlinPort }}
        run: make test-integration-gremlin

      - name: Run externally managed Gremlin port tests
        if: inputs.gremlinPort != 0 && inputs.gremlinPortRoute == 'external'
        env:
          GREMLIN_PORT: ${{ inputs.gremlinPort }}
        run: make test-integration-gremlin-external

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster
