name: CI - Lint, Unit Tests, Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4

      - name: helm lint
        run: make lint

  unittest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4

      - name: helm unittest
        run: make test-unit

  config-keys:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4

      - name: Rendered -Darcadedb.* keys exist in the appVersion image
        run: make test-config-keys

  integration:
    uses: ./.github/workflows/integration-reusable.yml

  integration-native:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      flavor: native

  # HA on a pre-26.11.1 image with a user-supplied root password Secret and no
  # cluster token: the chart passes the password as the env var
  # arcadedb.server.rootPassword instead of a file (issue #45). The tag is pinned
  # below 26.11.1 so that branch stays tested after appVersion moves past it.
  integration-root-password-env:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      imageTag: "26.10.2"
      rootPasswordSecret: arcadedb-root-password
      rootPasswordFrom: env

  # HA with a user-supplied root password Secret and a separate cluster token
  # Secret (issue #56): an explicit token makes the chart mount both as files on
  # any image version, rootPasswordPath from one Secret and clusterTokenPath from
  # the other.
  integration-cluster-token:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      rootPasswordSecret: arcadedb-root-password
      clusterTokenSecret: arcadedb-cluster-token

  # A single node (issue #56): no HA, so the chart mounts the root password file
  # only, with no cluster token. The suite skips its Raft phases.
  integration-single-node:
    uses: ./.github/workflows/integration-reusable.yml
    with:
      replicaCount: 1
