{{- if include "arcadedb.logging.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arcadedb.logging.configMapName" . }}
  labels:
    {{- include "arcadedb.labels" . | nindent 4 }}
data:
  {{- dict "arcadedb-log.properties" (include "arcadedb.logging.properties" .) | toYaml | nindent 2 }}
{{- end }}
