{{- include "arcadedb.observability.validate" . -}}
{{- include "arcadedb.configDirectory.validate" . -}}
{{- $native := include "arcadedb.native" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "arcadedb.fullname" . }}
    {{- with .Values.statefulSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "arcadedb.labels" . | nindent 4 }}
    {{- with .Values.statefulSetLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceName: {{ include "arcadedb.fullname" . }}
  podManagementPolicy: Parallel
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "arcadedb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with (include "arcadedb.podAnnotations" . | fromYaml) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arcadedb.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arcadedb.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $initContainers := include "arcadedb.initContainers" . | trim }}
      {{- if $initContainers }}
      initContainers:
        {{- $initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ include "arcadedb.image.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.http.port }}
              protocol: TCP
          {{- if .Values.tls.enabled }}
            - name: https
              containerPort: {{ .Values.service.https.port }}
              protocol: TCP
          {{- end }}
            - name: rpc
              containerPort: {{ .Values.service.rpc.port }}
              protocol: TCP
          command:
            {{- if $native }}
            {{- /*
              The native images (scratch/distroless) have no shell, so there is no
              server.sh to wrap the binary. Replacing the image ENTRYPOINT drops its
              flags, so they are repeated here, and the log directory server.sh would
              derive from ARCADEDB_LOG_DIR is passed directly.
            */}}
            - {{ .Values.arcadedb.installDirectory }}/bin/arcadedb
            - -Duser.home={{ .Values.arcadedb.installDirectory }}
            - -Dorg.jline.terminal.dumb=true
            - -Djava.util.logging.config.file={{ .Values.arcadedb.installDirectory }}/config/arcadedb-log.properties
            {{- with .Values.arcadedb.logsDirectory }}
            - -Darcadedb.server.logsDirectory={{ . }}
            {{- end }}
            {{- else }}
            - bin/server.sh
            {{- end }}
            {{- if and (not $native) .Values.arcadedb.consoleWorkingDirectory }}
            {{- /*
              ARCADEDB_SETTINGS (below) moves the JVM working directory so the
              interactive console can write its history file under a read-only
              root filesystem. server.sh splices $ARCADEDB_SETTINGS in ahead of
              these arguments, so this later -D pins the server itself back to
              the install directory and leaves its path resolution unchanged.
            */}}
            - -Duser.dir={{ .Values.arcadedb.installDirectory }}
            {{- end }}
            - -Darcadedb.dumpConfigAtStartup=true
            - -Darcadedb.server.name=$(HOSTNAME)
            - -Darcadedb.server.httpIncomingPort={{ .Values.service.http.port }}
            - -Darcadedb.server.rootPassword=$(rootPassword)
            - -Darcadedb.server.configDirectory={{ .Values.arcadedb.configDirectory }}
            - -Darcadedb.server.databaseDirectory={{ .Values.arcadedb.databaseDirectory }}
            - -Darcadedb.server.defaultDatabases={{ .Values.arcadedb.defaultDatabases }}
            {{- if or (gt (int .Values.replicaCount) 1) .Values.autoscaling.enabled }}
            - -Darcadedb.ha.enabled=true
            - -Darcadedb.ha.k8s=true
            - -Darcadedb.ha.k8sSuffix={{ include "arcadedb.k8sSuffix" . }}
            - -Darcadedb.ha.serverList={{ include "arcadedb.nodenames" . }}
            - -Darcadedb.ha.raftPort={{ .Values.service.rpc.port }}
            - -Darcadedb.ha.raftStorageDirectory={{ .Values.arcadedb.ha.raftStorageDirectory }}
            {{- end }}
            {{- with .Values.arcadedb.extraCommands }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- include "arcadedb.plugin.parameters" . | nindent 12 }}
            {{- include "arcadedb.observability.args" . | nindent 12 }}
            {{- include "arcadedb.tls.parameters" . | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.arcadedb.backupConfigMap }}
            - name: arcadedb-config-backup-json
              mountPath: {{ .Values.arcadedb.configDirectory }}/backup.json
              subPath: backup.json
              readOnly: true
            {{- end }}
            {{- if .Values.arcadedb.mcpConfigMap }}
            - name: arcadedb-config-mcp-json
              mountPath: {{ .Values.arcadedb.configDirectory }}/mcp-config.json
              subPath: mcp-config.json
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: rootPassword
              {{- if .Values.arcadedb.credentials.rootPassword.secret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.arcadedb.credentials.rootPassword.secret.name }}
                  key: {{ .Values.arcadedb.credentials.rootPassword.secret.key }}
                  optional: false
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: arcadedb-credentials-secret
                  key: rootPassword
              {{- end }}
            {{- if not $native }}
            - name: ARCADEDB_LOG_DIR
              value: {{ .Values.arcadedb.logsDirectory | quote }}
            {{- end }}
            {{- with .Values.arcadedb.tmpDirectory }}
            {{- if not $native }}
            - name: ARCADEDB_PID
              value: {{ printf "%s/arcadedb.pid" . | quote }}
            {{- end }}
            - name: XDG_CACHE_HOME
              value: {{ printf "%s/.cache" . | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: TLS_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "arcadedb.tls.passwordSecretName" . }}
                  key: {{ include "arcadedb.tls.passwordSecretKey" . }}
            {{- end }}
            {{- if not $native }}
            {{- with .Values.arcadedb.consoleWorkingDirectory }}
            - name: ARCADEDB_SETTINGS
              value: {{ printf "-Duser.dir=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.arcadedb.extraEnvironment }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.arcadedb.backupConfigMap }}
        - name: arcadedb-config-backup-json
          configMap:
            name: {{ .Values.arcadedb.backupConfigMap }}
        {{- end }}
        {{- if .Values.arcadedb.mcpConfigMap }}
        - name: arcadedb-config-mcp-json
          configMap:
            name: {{ .Values.arcadedb.mcpConfigMap }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ include "arcadedb.tls.secretName" . }}
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- toYaml . | nindent 4 }}
  {{- end }}
