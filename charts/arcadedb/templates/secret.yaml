{{- if not .Values.arcadedb.credentials.rootPassword.secret.name }}
{{ $secret := (lookup "v1" "Secret" .Release.Namespace "arcadedb-credentials-secret") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: arcadedb-credentials-secret
type: Opaque
data:
  # retrieve the secret data using lookup function and when not exists, return an empty dictionary / map as result
  {{- $secretData := (get $secret "data") | default dict }}
  {{- $rootPassword := (get $secretData "rootPassword") | default (randAlphaNum 32 | b64enc) }}
  rootPassword: {{ $rootPassword }}
  {{- /* dig: helm upgrade --reuse-values from an older release has no clusterToken key */}}
  {{- if not (dig "clusterToken" "secret" "name" "" .Values.arcadedb.credentials) }}
  {{- /*
    Dedicated HA cluster token, generated once and kept across upgrades like the
    root password. Rendered even on a single node so a later scale-up finds it.
  */}}
  {{- $clusterToken := (get $secretData "clusterToken") | default (randAlphaNum 64 | b64enc) }}
  clusterToken: {{ $clusterToken }}
  {{- end }}
{{- end }}
