suite: NOTES.txt
templates:
  - NOTES.txt
release:
  name: test
  namespace: default
tests:
  - it: includes the application URL preamble
    asserts:
      - matchRegex:
          path: raw
          pattern: "Get the application URL"

  - it: shows port-forward instructions for default ClusterIP service type
    asserts:
      - matchRegex:
          path: raw
          pattern: "kubectl --namespace default port-forward"

  - it: shows ingress URLs when ingress is enabled
    set:
      ingress.enabled: true
    asserts:
      - matchRegex:
          path: raw
          pattern: "http://chart-example.local/"

  - it: shows https URL when ingress TLS is configured
    set:
      ingress.enabled: true
      ingress.tls:
        - secretName: my-tls
          hosts: [chart-example.local]
    asserts:
      - matchRegex:
          path: raw
          pattern: "https://chart-example.local/"

  - it: does not warn about ephemeral data with default values
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "EPHEMERAL"

  - it: does not warn about ephemeral data for an HA install with default values
    set:
      replicaCount: 3
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "EPHEMERAL"

  - it: warns that the database directory is ephemeral when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: arcadedb-data is backed by an emptyDir"
      - matchRegex:
          path: raw
          pattern: "EPHEMERAL"

  - it: warns that the config directory is ephemeral when config persistence is disabled
    set:
      persistence.config.enabled: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: arcadedb-config is backed by an emptyDir"

  - it: warns about Raft state only when HA is active
    set:
      replicaCount: 3
      persistence.raft.enabled: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: arcadedb-raft is backed by an emptyDir"

  - it: does not warn about Raft state on a single node
    set:
      persistence.raft.enabled: false
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "EPHEMERAL"

  - it: lists every ephemeral reserved volume in one warning
    set:
      replicaCount: 3
      persistence.enabled: false
      persistence.config.enabled: false
      persistence.raft.enabled: false
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: arcadedb-data, arcadedb-config, arcadedb-raft are backed by an emptyDir"

  - it: warns when a volumes override puts a reserved directory on an emptyDir with persistence off
    set:
      persistence.enabled: false
      volumes:
        - name: arcadedb-data
          emptyDir: {}
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: arcadedb-data is backed by an emptyDir"

  - it: does not warn when a user volume or claim backs the directory
    set:
      persistence.enabled: false
      persistence.config.enabled: false
      volumes:
        - name: arcadedb-data
          hostPath: { path: /mnt/data }
      volumeClaimTemplates:
        - metadata: { name: arcadedb-config }
          spec:
            accessModes: [ReadWriteOnce]
            resources: { requests: { storage: 1Gi } }
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "EPHEMERAL"

  - it: warns that server.sh env vars are ignored by the native image
    set:
      image.flavor: native
      arcadedb.extraEnvironment:
        - { name: JAVA_OPTS, value: "-Xmx2g" }
    asserts:
      - matchRegex:
          path: raw
          pattern: "WARNING: arcadedb.extraEnvironment sets JAVA_OPTS"

  - it: does not warn about server.sh env vars on the jvm image
    set:
      arcadedb.extraEnvironment:
        - { name: JAVA_OPTS, value: "-Xmx2g" }
    asserts:
      - notMatchRegex:
          path: raw
          pattern: "WARNING: arcadedb.extraEnvironment sets"
