suite: StatefulSet
templates:
  - statefulset.yaml
release:
  name: test
  namespace: default
tests:
  - it: renders one StatefulSet by default
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: StatefulSet }
      - equal: { path: metadata.name, value: test-arcadedb }
      - equal: { path: spec.serviceName, value: test-arcadedb }

  - it: podManagementPolicy is Parallel for reliable HA bootstrap
    asserts:
      - equal: { path: spec.podManagementPolicy, value: Parallel }

  - it: default replicas is 1
    asserts:
      - equal: { path: spec.replicas, value: 1 }

  - it: replicas field is omitted when autoscaling is enabled
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 5
    asserts:
      - notExists: { path: spec.replicas }

  - it: respects custom replicaCount
    set:
      replicaCount: 3
    asserts:
      - equal: { path: spec.replicas, value: 3 }

  - it: selector matches expected app labels
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: arcadedb
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test

  - it: image string composes registry/repository:tag, defaulting tag to AppVersion
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: arcadedata/arcadedb:26.10.2

  - it: image.tag override wins over AppVersion default
    set:
      image.tag: "27.0.0-rc1"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: arcadedata/arcadedb:27.0.0-rc1

  - it: image.registry and image.repository overrides flow through
    set:
      image.registry: my-registry.example.com
      image.repository: arcadedb-fork
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: my-registry.example.com/arcadedb-fork:26.10.2

  - it: image.pullPolicy default is IfNotPresent and is overridable
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: IfNotPresent

  - it: image.pullPolicy override flows through
    set:
      image.pullPolicy: Always
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: Always

  - it: container exposes http port 2480 and rpc port 2434 by default
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].ports"
          content: { name: http, containerPort: 2480, protocol: TCP }
      - contains:
          path: "spec.template.spec.containers[0].ports"
          content: { name: rpc, containerPort: 2434, protocol: TCP }

  - it: container ports reflect custom service.http.port and service.rpc.port
    set:
      service.http.port: 9090
      service.rpc.port: 5555
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].ports"
          content: { name: http, containerPort: 9090, protocol: TCP }
      - contains:
          path: "spec.template.spec.containers[0].ports"
          content: { name: rpc, containerPort: 5555, protocol: TCP }

  - it: liveness probe defaults to /api/v1/health and readiness to /api/v1/ready
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].livenessProbe.httpGet.path"
          value: /api/v1/health
      - equal:
          path: "spec.template.spec.containers[0].livenessProbe.httpGet.port"
          value: http
      - equal:
          path: "spec.template.spec.containers[0].readinessProbe.httpGet.path"
          value: /api/v1/ready
      - equal:
          path: "spec.template.spec.containers[0].readinessProbe.httpGet.port"
          value: http

  - it: HA flags are absent when replicaCount is 1 and autoscaling is disabled
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].command"
          content: "-Darcadedb.ha.enabled=true"
      - notContains:
          path: "spec.template.spec.containers[0].command"
          content: "-Darcadedb.ha.k8s=true"

  - it: HA flags render when replicaCount > 1
    set:
      replicaCount: 3
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].command"
          content: "-Darcadedb.ha.enabled=true"
      - contains:
          path: "spec.template.spec.containers[0].command"
          content: "-Darcadedb.ha.k8s=true"
      - contains:
          path: "spec.template.spec.containers[0].command"
          content: "-Darcadedb.ha.raftPort=2434"

  - it: HA flags render when autoscaling is enabled even with replicaCount 1
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 5
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].command"
          content: "-Darcadedb.ha.enabled=true"

  - it: serviceAccountName flows from arcadedb.serviceAccountName helper
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: test-arcadedb }

  - it: serviceAccountName falls back to "default" when create=false and no name
    set:
      serviceAccount.create: false
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }

  - it: serviceAccountName uses custom name when provided
    set:
      serviceAccount.name: my-sa
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: my-sa }

  - it: StatefulSet metadata accepts custom annotations and labels
    set:
      statefulSetAnnotations:
        example.com/owner: platform
      statefulSetLabels:
        app.kubernetes.io/component: database
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: database

  - it: TLS adds HTTPS port, certificate mounts, and SSL startup arguments
    set:
      tls.enabled: true
      tls.bolt: REQUIRED
      tls.postgres: REQUIRED
      arcadedb.plugins.bolt.enabled: true
      arcadedb.plugins.postgres.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content: { name: https, containerPort: 2490, protocol: TCP }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs
            mountPath: /etc/certs/arcadedb
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs
            secret:
              secretName: test-arcadedb-tls
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.enabled=true"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.httpsIncomingPort=2490"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.bolt.ssl=REQUIRED"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.ssl=REQUIRED"

  - it: postgres TLS defaults to DISABLED when TLS and the postgres plugin are enabled
    set:
      tls.enabled: true
      arcadedb.plugins.postgres.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.ssl=DISABLED"

  - it: TLS modes are normalised to upper case
    set:
      tls.enabled: true
      tls.postgres: optional
      arcadedb.plugins.postgres.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.ssl=OPTIONAL"

  - it: plugin TLS flags are omitted when their plugin is disabled
    set:
      tls.enabled: true
      tls.postgres: REQUIRED
      arcadedb.plugins.postgres.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.ssl=REQUIRED"
      - notContains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.bolt.ssl=OPTIONAL"

  - it: plugin TLS flags are omitted when TLS is disabled
    set:
      tls.postgres: REQUIRED
      tls.bolt: REQUIRED
      arcadedb.plugins.postgres.enabled: true
      arcadedb.plugins.bolt.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.ssl=REQUIRED"
      - notContains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.bolt.ssl=REQUIRED"

  - it: an invalid plugin TLS mode fails rendering
    set:
      tls.enabled: true
      tls.postgres: REQUIERED
      arcadedb.plugins.postgres.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "tls.postgres must be DISABLED, OPTIONAL or REQUIRED"

  - it: TLS volume mount uses the configured path and secret
    set:
      tls.enabled: true
      tls.mountPath: /var/run/arcadedb-tls
      tls.secretRef.name: custom-arcadedb-tls
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: tls-certs
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/run/arcadedb-tls
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tls-certs
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: custom-arcadedb-tls

  - it: cert-manager TLS uses PKCS12 certificate store names
    set:
      tls.enabled: true
      tls.certManager.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Djavax.net.ssl.trustStoreType=PKCS12"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.keyStore=/etc/certs/arcadedb/keystore.p12"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.trustStore=/etc/certs/arcadedb/truststore.p12"

  - it: cert-manager TLS falls back to the key store when the issuer provides no CA
    set:
      tls.enabled: true
      tls.certManager.enabled: true
      tls.certManager.issuerProvidesCA: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.trustStore=/etc/certs/arcadedb/keystore.p12"

  - it: TLS store passwords come from a secret-backed env var, never inline
    set:
      tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.keyStorePassword=$(TLS_STORE_PASSWORD)"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.trustStorePassword=$(TLS_STORE_PASSWORD)"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TLS_STORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: arcadedb-credentials-secret
                key: rootPassword

  - it: TLS_STORE_PASSWORD is absent without TLS
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: TLS_STORE_PASSWORD

  - it: PID file and XDG cache follow arcadedb.tmpDirectory
    set:
      arcadedb.tmpDirectory: /scratch
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: ARCADEDB_PID, value: /scratch/arcadedb.pid }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: XDG_CACHE_HOME, value: /scratch/.cache }

  - it: empty arcadedb.tmpDirectory keeps the image defaults
    set:
      arcadedb.tmpDirectory: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ARCADEDB_PID

  - it: env contains HOSTNAME from metadata.name field reference
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: env contains POD_ID from status.podIP field reference
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: POD_ID
            valueFrom:
              fieldRef:
                fieldPath: status.podIP

  - it: pod-level security context defaults render
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 1000 }

  - it: container-level security context defaults render
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: pod-level security context can be overridden
    set:
      podSecurityContext:
        runAsNonRoot: false
        fsGroup: 2000
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: false }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 2000 }

  # ── persistence (#34) ────────────────────────────────────────────────────────

  - it: default persists the data dir on a generated PVC and has no emptyDir for it
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-data
            mountPath: /home/arcadedb/databases
      - contains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: arcadedb-data
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 8Gi
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-data
            emptyDir: {}
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-data

  - it: default persists the config dir on a generated PVC and has no volume for it
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-config
            mountPath: /home/arcadedb/config
      - contains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: arcadedb-config
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-config

  - it: default single node renders only the data and config PVCs and keeps raft on an emptyDir
    asserts:
      - lengthEqual: { path: spec.volumeClaimTemplates, count: 2 }
      - equal: { path: "spec.volumeClaimTemplates[0].metadata.name", value: arcadedb-data }
      - equal: { path: "spec.volumeClaimTemplates[1].metadata.name", value: arcadedb-config }
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-raft
            emptyDir: {}

  - it: HA active persists Raft state on a generated PVC
    set:
      replicaCount: 3
    asserts:
      - lengthEqual: { path: spec.volumeClaimTemplates, count: 3 }
      - contains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: arcadedb-raft
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-raft

  - it: autoscaling persists Raft state on a generated PVC even when replicaCount is 1
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 3
    asserts:
      - contains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-raft
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-raft

  - it: logs and tmp stay on emptyDir whatever the persistence settings
    set:
      replicaCount: 3
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-logs, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-tmp, emptyDir: {} }

  - it: persistence.enabled false backs the data dir with an emptyDir and drops its PVC
    set:
      persistence.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-data, emptyDir: {} }
      - notContains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-data

  - it: persistence.config.enabled false backs the config dir with an emptyDir and drops its PVC
    set:
      persistence.config.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-config, emptyDir: {} }
      - notContains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-config

  - it: persistence.raft.enabled false keeps Raft state on an emptyDir under HA
    set:
      replicaCount: 3
      persistence.raft.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-raft, emptyDir: {} }
      - notContains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-raft

  - it: all persistence disabled renders no volumeClaimTemplates and emptyDirs for every reserved volume
    set:
      replicaCount: 3
      persistence.enabled: false
      persistence.config.enabled: false
      persistence.raft.enabled: false
    asserts:
      - notExists:
          path: spec.volumeClaimTemplates
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-data, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-config, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-raft, emptyDir: {} }

  - it: data PVC size, accessMode and storageClass overrides flow through
    set:
      persistence.size: 100Gi
      persistence.accessMode: ReadWriteMany
      persistence.storageClass: fast-ssd
    asserts:
      - equal: { path: "spec.volumeClaimTemplates[0].metadata.name", value: arcadedb-data }
      - equal: { path: "spec.volumeClaimTemplates[0].spec.resources.requests.storage", value: 100Gi }
      - equal: { path: "spec.volumeClaimTemplates[0].spec.accessModes[0]", value: ReadWriteMany }
      - equal: { path: "spec.volumeClaimTemplates[0].spec.storageClassName", value: fast-ssd }

  - it: config PVC size, accessMode and storageClass overrides flow through
    set:
      persistence.config.size: 2Gi
      persistence.config.accessMode: ReadWriteMany
      persistence.config.storageClass: nfs
    asserts:
      - equal: { path: "spec.volumeClaimTemplates[1].metadata.name", value: arcadedb-config }
      - equal: { path: "spec.volumeClaimTemplates[1].spec.resources.requests.storage", value: 2Gi }
      - equal: { path: "spec.volumeClaimTemplates[1].spec.accessModes[0]", value: ReadWriteMany }
      - equal: { path: "spec.volumeClaimTemplates[1].spec.storageClassName", value: nfs }

  - it: raft PVC size, accessMode and storageClass overrides flow through
    set:
      replicaCount: 3
      persistence.raft.size: 5Gi
      persistence.raft.accessMode: ReadWriteMany
      persistence.raft.storageClass: fast-ssd
    asserts:
      - equal: { path: "spec.volumeClaimTemplates[2].metadata.name", value: arcadedb-raft }
      - equal: { path: "spec.volumeClaimTemplates[2].spec.resources.requests.storage", value: 5Gi }
      - equal: { path: "spec.volumeClaimTemplates[2].spec.accessModes[0]", value: ReadWriteMany }
      - equal: { path: "spec.volumeClaimTemplates[2].spec.storageClassName", value: fast-ssd }

  - it: an empty storageClass leaves storageClassName unset so the cluster default applies
    asserts:
      - notExists: { path: "spec.volumeClaimTemplates[0].spec.storageClassName" }
      - notExists: { path: "spec.volumeClaimTemplates[1].spec.storageClassName" }

  - it: a user-provided data volumeClaimTemplate replaces the generated one
    set:
      volumeClaimTemplates:
        - metadata: { name: arcadedb-data }
          spec:
            accessModes: [ReadWriteMany]
            resources: { requests: { storage: 100Gi } }
            storageClassName: fast-ssd
    asserts:
      - lengthEqual: { path: spec.volumeClaimTemplates, count: 2 }
      - equal: { path: "spec.volumeClaimTemplates[0].metadata.name", value: arcadedb-config }
      - equal: { path: "spec.volumeClaimTemplates[1].metadata.name", value: arcadedb-data }
      - equal: { path: "spec.volumeClaimTemplates[1].spec.resources.requests.storage", value: 100Gi }
      - equal: { path: "spec.volumeClaimTemplates[1].spec.storageClassName", value: fast-ssd }
      - equal: { path: "spec.volumeClaimTemplates[1].spec.accessModes[0]", value: ReadWriteMany }
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-data

  - it: a user volumeClaimTemplate wins even when the matching persistence flag is off
    set:
      persistence.enabled: false
      volumeClaimTemplates:
        - metadata: { name: arcadedb-data }
          spec:
            accessModes: [ReadWriteOnce]
            resources: { requests: { storage: 20Gi } }
    asserts:
      - contains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-data
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-data

  # Values files copied from the chart before #34 list every reserved volume as an
  # emptyDir under `volumes`; the persistence flags must still win over those.
  - it: an emptyDir for a persisted directory in a volumes override is dropped in favour of the PVC
    set:
      volumes:
        - name: arcadedb-data
          emptyDir: {}
        - name: arcadedb-config
          emptyDir: {}
        - name: arcadedb-logs
          emptyDir: {}
        - name: arcadedb-tmp
          emptyDir: {}
        - name: arcadedb-raft
          emptyDir: {}
    asserts:
      - lengthEqual: { path: spec.volumeClaimTemplates, count: 2 }
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-data
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-config
      # raft is not persisted on a single node, so the user's emptyDir stays, once
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-raft, emptyDir: {} }
      # logs, tmp, raft, plus the chart's arcadedb-credentials and arcadedb-logging volumes
      - lengthEqual: { path: spec.template.spec.volumes, count: 5 }

  - it: a non-emptyDir volume for a reserved name is kept and no PVC is generated for it
    set:
      volumes:
        - name: arcadedb-data
          hostPath:
            path: /mnt/data
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-data
            hostPath:
              path: /mnt/data
      - notContains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-data
      # the override replaces the whole default list, so the other reserved
      # directories still get their chart-provided backing
      - contains:
          path: spec.volumeClaimTemplates
          any: true
          content:
            metadata:
              name: arcadedb-config
      - contains:
          path: spec.template.spec.volumes
          content: { name: arcadedb-raft, emptyDir: {} }

  - it: extra volumeClaimTemplates are appended after the generated PVCs
    set:
      volumeClaimTemplates:
        - metadata: { name: arcadedb-backups }
          spec:
            accessModes: [ReadWriteOnce]
            resources: { requests: { storage: 1Gi } }
    asserts:
      - lengthEqual: { path: spec.volumeClaimTemplates, count: 3 }
      - equal: { path: "spec.volumeClaimTemplates[0].metadata.name", value: arcadedb-data }
      - equal: { path: "spec.volumeClaimTemplates[1].metadata.name", value: arcadedb-config }
      - equal: { path: "spec.volumeClaimTemplates[2].metadata.name", value: arcadedb-backups }

  - it: rootPassword env defaults to auto-generated secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: rootPassword
            valueFrom:
              secretKeyRef:
                name: arcadedb-credentials-secret
                key: rootPassword

  - it: rootPassword env points at user-supplied secret when configured
    set:
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: rootPassword
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: my-key
                optional: false

  - it: imagePullSecrets flow through when set
    set:
      imagePullSecrets:
        - name: regcred
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content: { name: regcred }

  - it: imagePullSecrets are absent by default
    asserts:
      - notExists: { path: spec.template.spec.imagePullSecrets }

  - it: podAnnotations flow through
    set:
      podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: podLabels flow through (merged with chart labels)
    set:
      podLabels:
