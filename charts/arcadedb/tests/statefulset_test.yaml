    asserts:
      - equal:
          path: spec.template.metadata.labels["my-team"]
          value: data
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: arcadedb

  - it: nodeSelector flows through
    set:
      nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: tolerations flow through
    set:
      tolerations:
        - key: dedicated
          operator: Equal
          value: arcadedb
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content: { key: dedicated, operator: Equal, value: arcadedb, effect: NoSchedule }

  - it: affinity defaults render podAntiAffinity
    asserts:
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution

  - it: affinity can be overridden
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: [linux]
    asserts:
      - exists:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution

  - it: resources flow through when set
    set:
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "2Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "4Gi"

  - it: resources are empty by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  - it: arcadedb.extraCommands appear in container command
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.mode=production"

  - it: arcadedb.extraEnvironment flows through to env
    set:
      arcadedb.extraEnvironment:
        - name: MY_VAR
          value: my-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: my-value

  - it: extra volumes flow through
    set:
      volumes:
        - name: config
          configMap:
            name: my-config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap: { name: my-config }

  - it: extra volumeMounts flow through
    set:
      volumeMounts:
        - name: arcadedb-config
          mountPath: /home/arcadedb/config
        - name: config
          mountPath: /etc/arcadedb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/arcadedb

  - it: command includes default configDirectory, databaseDirectory and defaultDatabases flags
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.configDirectory=/home/arcadedb/config"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.databaseDirectory=/home/arcadedb/databases"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.defaultDatabases="

  - it: arcadedb.configDirectory, arcadedb.databaseDirectory and defaultDatabases flow through
    set:
      arcadedb.configDirectory: /custom/config
      arcadedb.databaseDirectory: /custom/dir
      arcadedb.defaultDatabases: "Universe[admin:pwd]"
      volumeMounts:
        - name: arcadedb-config
          mountPath: /custom/config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.configDirectory=/custom/config"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.databaseDirectory=/custom/dir"
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.defaultDatabases=Universe[admin:pwd]"

  - it: a configDirectory outside every volumeMounts entry fails under readOnlyRootFilesystem
    set:
      arcadedb.configDirectory: /custom/config
    asserts:
      - failedTemplate:
          errorPattern: "arcadedb.configDirectory \\(/custom/config\\) is not on any volumeMounts entry"

  - it: a configDirectory under a mounted parent directory is accepted
    set:
      arcadedb.configDirectory: /data/arcadedb/config
      volumeMounts:
        - name: arcadedb-config
          mountPath: /data/arcadedb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.configDirectory=/data/arcadedb/config"

  - it: a configDirectory sharing only a name prefix with a mount fails
    set:
      arcadedb.configDirectory: /home/arcadedb/configuration
    asserts:
      - failedTemplate:
          errorPattern: "is not on any volumeMounts entry"

  - it: an unmounted configDirectory is allowed with a writable root filesystem
    set:
      arcadedb.configDirectory: /custom/config
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.configDirectory=/custom/config"

  - it: initContainers are omitted by default when config seeding is off
    set:
      initContainers.configSeed.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: config-chown mounts the volume where ArcadeDB does and chowns the config dir
    set:
      initContainers.configSeed.enabled: false
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/config
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: config-chown
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: docker.io/library/busybox:1.37.0
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: arcadedb-config
              mountPath: /home/arcadedb/config
      - equal:
          path: spec.template.spec.initContainers[0].command
          value:
            - sh
            - -c
            - mkdir -p "$1" && chown "$2" "$1"
            - config-chown
            - /home/arcadedb/config
            - "1000:1000"

  - it: config-chown runs as root with only the capabilities it needs
    set:
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/config
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
            seccompProfile:
              type: RuntimeDefault

  - it: config-chown accepts a mountPath that is a parent of the config dir
    set:
      arcadedb.configDirectory: /var/lib/arcadedb/config/
      securityContext.runAsUser: 2000
      securityContext.runAsGroup: 3000
      initContainers.configDirectory.volumeName: arcadedb-state
      initContainers.configDirectory.mountPath: /var/lib/arcadedb/
      volumeMounts:
        - name: arcadedb-state
          mountPath: /var/lib/arcadedb/
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].command[4]
          value: /var/lib/arcadedb/config
      - equal:
          path: spec.template.spec.initContainers[0].command[5]
          value: "2000:3000"
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /var/lib/arcadedb/

  - it: config-chown falls back to fsGroup when runAsGroup is unset
    set:
      securityContext.runAsGroup: null
      podSecurityContext.fsGroup: 4000
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/config
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].command[5]
          value: "1000:4000"

  - it: config-chown does not depend on the backup or mcp config maps
    set:
      arcadedb.backupConfigMap: backup
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/config
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: config-chown

  - it: config-chown fails when mountPath does not contain the config dir
    set:
      arcadedb.configDirectory: /var/lib/arcadedb/config
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /mnt/arcadedb-config
    asserts:
      - failedTemplate:
          errorPattern: "must be arcadedb.configDirectory .* or one of its parent directories"

  - it: config-chown rejects a sibling path that only shares a prefix
    set:
      arcadedb.configDirectory: /home/arcadedb/config
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/conf
    asserts:
      - failedTemplate:
          errorPattern: "must be arcadedb.configDirectory"

  - it: config-chown requires securityContext.runAsUser
    set:
      securityContext.runAsUser: null
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/config
    asserts:
      - failedTemplate:
          errorPattern: "requires securityContext.runAsUser"

  - it: config-chown is omitted without a volume name
    set:
      initContainers.configSeed.enabled: false
      arcadedb.backupConfigMap: backup
      initContainers.configDirectory.mountPath: /home/arcadedb/config
    asserts:
      - notExists:
          path: spec.template.spec.initContainers

  - it: custom init containers render after config-chown
    set:
      initContainers.configSeed.enabled: false
      initContainers.configDirectory.volumeName: arcadedb-config
      initContainers.configDirectory.mountPath: /home/arcadedb/config
      initContainers.otherContainers:
        - name: wait-for-config
          image: busybox:1.37.0
          command: ["sh", "-c", "test -d /home/arcadedb/config"]
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-config

  - it: custom init containers render on their own
    set:
      initContainers.configSeed.enabled: false
      initContainers.otherContainers:
        - name: custom-init
          image: busybox:1.37.0
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: custom-init

  # ── config dir ───────────────────────────────────────────────────────────────

  - it: backupConfigMap and mcpConfigMap render read-only JSON mounts from named ConfigMaps
    set:
      arcadedb.configDirectory: /custom/config
      arcadedb.backupConfigMap: backup
      arcadedb.mcpConfigMap: mcp
      volumeMounts:
        - name: arcadedb-config
          mountPath: /custom/config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-config-backup-json
            mountPath: /custom/config/backup.json
            subPath: backup.json
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-config-mcp-json
            mountPath: /custom/config/mcp-config.json
            subPath: mcp-config.json
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-config-backup-json
            configMap:
              name: backup
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-config-mcp-json
            configMap:
              name: mcp

  - it: log dir is wired via ARCADEDB_LOG_DIR and backed by a writable emptyDir
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCADEDB_LOG_DIR
            value: /home/arcadedb/log
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-logs
            mountPath: /home/arcadedb/log
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-logs
            emptyDir: {}

  - it: a writable emptyDir is mounted at /tmp for the JVM
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-tmp
            emptyDir: {}

  - it: arcadedb.logsDirectory override flows through to the ARCADEDB_LOG_DIR env only
    set:
      arcadedb.logsDirectory: /var/log/arcadedb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ARCADEDB_LOG_DIR
            value: /var/log/arcadedb
      # mount path is static (value-driven from volumeMounts), decoupled from logsDirectory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-logs
            mountPath: /home/arcadedb/log

  - it: HA active wires raftStorageDirectory arg and a writable raft emptyDir when Raft persistence is off
    set:
      replicaCount: 3
      persistence.raft.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.raftStorageDirectory=/home/arcadedb/raft
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-raft
            mountPath: /home/arcadedb/raft
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-raft
            emptyDir: {}

  - it: single-node wires the raft emptyDir volume and mount but emits no HA args
    asserts:
      # raft volume/mount are always present (value-driven), regardless of replica count
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-raft
            mountPath: /home/arcadedb/raft
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-raft
            emptyDir: {}
      # HA is still gated on replicaCount > 1, so no -Darcadedb.ha.* args at replicaCount 1
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.enabled=true
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.raftStorageDirectory=/home/arcadedb/raft

  - it: raftStorageDirectory override flows through to the HA command arg when HA active
    set:
      replicaCount: 3
      arcadedb.ha.raftStorageDirectory: /data/raft
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.raftStorageDirectory=/data/raft
      # mount path is static (value-driven), decoupled from the raftStorageDirectory arg
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-raft
            mountPath: /home/arcadedb/raft

  - it: autoscaling enabled wires the raft arg and mount even when replicaCount is 1
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
      autoscaling.maxReplicas: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.raftStorageDirectory=/home/arcadedb/raft
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-raft
            mountPath: /home/arcadedb/raft

  # ── null plugin entries (#32) ────────────────────────────────────────────────

  - it: a null plugin entry is treated as disabled in the startup flags
    set:
      arcadedb.plugins.postgres: null
      arcadedb.plugins.gremlin.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.server.plugins=GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin"
      - notContains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.port=5432"

  - it: a null plugin entry does not break TLS rendering
    set:
      tls.enabled: true
      arcadedb.plugins.postgres: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.ssl.enabled=true"
      - notContains:
          path: spec.template.spec.containers[0].command
          content: "-Darcadedb.postgres.ssl=DISABLED"

  # --- issue #35: root password and HA cluster token mounted as files -------

  - it: single node reads the root password from the mounted Secret, never from the command line
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-credentials
            mountPath: /etc/arcadedb/secrets
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-credentials
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: arcadedb-credentials-secret
                    items:
                      - key: rootPassword
                        path: rootPassword

  - it: single node with a user-supplied root password Secret mounts that Secret's key
    set:
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-credentials
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: my-secret
                    items:
                      - key: my-key
                        path: rootPassword

  - it: native image also reads the root password from the mounted Secret
    set:
      image.flavor: native
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)

  - it: HA with the chart-generated Secret mounts a dedicated cluster token and the root password
    set:
      replicaCount: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-credentials
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: arcadedb-credentials-secret
                    items:
                      - key: rootPassword
                        path: rootPassword
                - secret:
                    name: arcadedb-credentials-secret
                    items:
                      - key: clusterToken
                        path: clusterToken

  - it: autoscaling (HA) also mounts the dedicated cluster token
    set:
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      autoscaling.maxReplicas: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword

  - it: HA with a user-supplied root password Secret and no token keeps the derived token and the inline password on pre-26.11.1 images
    set:
      replicaCount: 3
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: arcadedb-credentials
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: arcadedb-credentials

  - it: HA with user-supplied root password and cluster token Secrets mounts both
    set:
      replicaCount: 3
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
      arcadedb.credentials.clusterToken.secret.name: my-token-secret
      arcadedb.credentials.clusterToken.secret.key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-credentials
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: my-secret
                    items:
                      - key: my-key
                        path: rootPassword
                - secret:
                    name: my-token-secret
                    items:
                      - key: token
                        path: clusterToken

  - it: clusterToken.secret.key defaults to clusterToken
    set:
      replicaCount: 3
      arcadedb.credentials.clusterToken.secret.name: my-token-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-credentials
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: arcadedb-credentials-secret
                    items:
                      - key: rootPassword
                        path: rootPassword
                - secret:
                    name: my-token-secret
                    items:
                      - key: clusterToken
                        path: clusterToken

  - it: a user-supplied cluster token Secret is not mounted without HA
    set:
      arcadedb.credentials.clusterToken.secret.name: my-token-secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
      - contains:
          path: spec.template.spec.volumes
          content:
            name: arcadedb-credentials
            projected:
              defaultMode: 288
              sources:
                - secret:
                    name: arcadedb-credentials-secret
                    items:
                      - key: rootPassword
                        path: rootPassword

  - it: from 26.11.1 the root password file is used in HA without an explicit token (the server derives the token from it)
    set:
      replicaCount: 3
      image.tag: "26.11.1"
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)
      - notContains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken

  - it: the image version gate reads a -native suffixed tag
    set:
      replicaCount: 3
      image.flavor: native
      image.tag: "26.12.1-native"
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword

  - it: a non-version tag falls back to the inline root password when HA has no explicit token
    set:
      replicaCount: 3
      image.tag: latest
      arcadedb.credentials.rootPassword.secret.name: my-secret
      arcadedb.credentials.rootPassword.secret.key: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPassword=$(rootPassword)

  - it: arcadedb.credentials.mountPath is configurable and the -D paths follow it
    set:
      replicaCount: 3
      arcadedb.credentials.mountPath: /var/run/arcadedb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/var/run/arcadedb/rootPassword
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/var/run/arcadedb/clusterToken
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: arcadedb-credentials
            mountPath: /var/run/arcadedb
            readOnly: true

  - it: mounted secret files are world-readable (0444) when the pod has no fsGroup to grant group access
    set:
      podSecurityContext:
        fsGroup: null
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "arcadedb-credentials")].projected.defaultMode
          value: 292

  - it: the mounted secret volume survives a user override of the volumes list
    set:
      volumes:
        - name: arcadedb-data
          emptyDir: {}
    asserts:
      - equal:
          path: spec.template.spec.volumes[?(@.name == "arcadedb-credentials")].projected.sources[0].secret.name
          value: arcadedb-credentials-secret

  - it: the rootPassword env var stays available in HA for extraCommands that reference $(rootPassword)
    set:
      replicaCount: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: rootPassword
            valueFrom:
              secretKeyRef:
                name: arcadedb-credentials-secret
                key: rootPassword

  - it: an upgrade with --reuse-values from a release without the new credential keys still renders
    set:
      replicaCount: 3
      arcadedb.credentials.mountPath: null
      arcadedb.credentials.clusterToken: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.server.rootPasswordPath=/etc/arcadedb/secrets/rootPassword
      - contains:
          path: spec.template.spec.containers[0].command
          content: -Darcadedb.ha.clusterTokenPath=/etc/arcadedb/secrets/clusterToken
