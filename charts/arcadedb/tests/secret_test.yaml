suite: Credentials Secret
templates:
  - secret.yaml
release:
  name: test
  namespace: default
tests:
  - it: renders the auto-generated credentials secret by default
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: arcadedb-credentials-secret }
      - equal: { path: type, value: Opaque }
      - exists: { path: data.rootPassword }

  - it: rootPassword is base64-encoded (32 chars random → 44 base64 chars including padding)
    asserts:
      - matchRegex:
          path: data.rootPassword
          pattern: "^[A-Za-z0-9+/]{43}=$"

  - it: is not rendered when an existing secret name is supplied
    set:
      arcadedb.credentials.rootPassword.secret.name: my-existing-secret
      arcadedb.credentials.rootPassword.secret.key: rootPassword
    asserts:
      - hasDocuments: { count: 0 }

  # --- issue #35: dedicated HA cluster token ---------------------------------

  - it: the generated Secret carries a high-entropy clusterToken (64 chars random → 88 base64 chars)
    asserts:
      - matchRegex:
          path: data.clusterToken
          pattern: "^[A-Za-z0-9+/]{86}==$"

  - it: the generated Secret also carries the clusterToken on a single node, ready for a later scale-up
    set:
      replicaCount: 1
    asserts:
      - exists: { path: data.clusterToken }

  - it: the generated Secret leaves out the clusterToken when a user-supplied token Secret is configured
    set:
      arcadedb.credentials.clusterToken.secret.name: my-token-secret
    asserts:
      - exists: { path: data.rootPassword }
      - notExists: { path: data.clusterToken }

  - it: an upgrade with --reuse-values from a release without arcadedb.credentials.clusterToken still renders the token
    set:
      arcadedb.credentials.clusterToken: null
    asserts:
      - exists: { path: data.clusterToken }
