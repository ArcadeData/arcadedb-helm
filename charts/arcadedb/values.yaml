## @param replicaCount Number of replicas. Values > 1 enable Raft HA automatically.
replicaCount: 1

## @section arcadedb
arcadedb:
  ## @param arcadedb.databaseDirectory Database storage directory inside the container
  databaseDirectory: "/home/arcadedb/databases"
  ## @param arcadedb.configDirectory Config storage directory inside the container (users, tokens, server settings)
  configDirectory: "/home/arcadedb/config"
  ## @param arcadedb.backupConfigMap ConfigMap containing the backup.json file
  backupConfigMap: null
  ## @param arcadedb.backupDirectory Directory the server writes backups to
  ## (scheduled through backupConfigMap, or BACKUP DATABASE), passed as
  ## -Darcadedb.server.backupDirectory. The chart mounts a writable volume here
  ## (see persistence.backups) unless a volumeMounts entry already covers it. Must
  ## not be inside databaseDirectory, where the server would open it as a database.
  ## Set to "" to leave the server default (<installDirectory>/backups, on the
  ## read-only root filesystem) and mount nothing.
  backupDirectory: "/home/arcadedb/backups"
  ## @param arcadedb.mcpConfigMap ConfigMap containing the mcp-config.json file
  mcpConfigMap: null
  ## @param arcadedb.defaultDatabases Databases to create at startup. Empty = none.
  ## Example: "Universe[admin:password]"
  defaultDatabases: ""
  ## @param arcadedb.extraCommands Extra JVM -D arguments appended to the startup command
  extraCommands:
    - -Darcadedb.server.mode=production
  ## @param arcadedb.extraEnvironment Additional environment variables for the container
  extraEnvironment: []
  ## @param arcadedb.logsDirectory Directory where the server writes log files.
  ## Backed by a writable emptyDir and forwarded via the ARCADEDB_LOG_DIR env var
  ## so logging works under readOnlyRootFilesystem.
  logsDirectory: "/home/arcadedb/log"

  ## @section arcadedb.logging
  ## The image ships arcadedb-log.properties in its config/ directory, which the
  ## arcadedb-config volume hides, so the server would fall back to the copy
  ## bundled in the engine jar: that one writes to a fixed ./log and ignores
  ## logsDirectory. The chart ships the file from a ConfigMap instead, mounted
  ## read-only at mountPath, and points -Djava.util.logging.config.file at it.
  ## A change to properties rolls the pods (checksum/logging annotation).
  logging:
    ## @param arcadedb.logging.enabled Ship arcadedb-log.properties from a ConfigMap.
    ## Set false to leave the logging configuration to the image (and its fallback).
    enabled: true
    ## @param arcadedb.logging.mountPath Directory the ConfigMap is mounted at.
    ## Must be outside arcadedb.configDirectory.
    mountPath: "/home/arcadedb/logging"
    ## @param arcadedb.logging.properties Content of arcadedb-log.properties
    ## (java.util.logging format). Defaults to the file packaged with ArcadeDB
    ## 26.10.2. ${arcadedb.server.logsDirectory} resolves to arcadedb.logsDirectory.
    properties: |
      # Specify the handlers to create in the root logger
      # (all loggers are children of the root logger)
      handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

      # Set the default logging level for the root logger
      .level = INFO
      # Suppress the Apache Ratis per-retry replication flood while a follower is briefly
      # unreachable. Genuine SEVERE failures still surface.
      org.apache.ratis.grpc.server.GrpcLogAppender.level = SEVERE
      com.arcadedb.level = INFO

      # Set the default logging level for new ConsoleHandler instances
      java.util.logging.ConsoleHandler.level = INFO
      # Set the default formatter for new ConsoleHandler instances
      java.util.logging.ConsoleHandler.formatter = com.arcadedb.utility.AnsiLogFormatter

      # Set the default logging level for new FileHandler instances
      java.util.logging.FileHandler.level = INFO
      # Naming style for the output file
      java.util.logging.FileHandler.pattern=${arcadedb.server.logsDirectory}/arcadedb.log
      # Set the default formatter for new FileHandler instances
      java.util.logging.FileHandler.formatter = com.arcadedb.log.LogFormatter
      # Limiting size of output file in bytes:
      java.util.logging.FileHandler.limit=100000000
      # Number of output files to cycle through, by appending an
      # integer to the base file name:
      java.util.logging.FileHandler.count=10
  ## @param arcadedb.installDirectory Directory the ArcadeDB distribution lives in
  ## inside the image (ARCADEDB_HOME, and the image WORKDIR). The server pins its
  ## JVM working directory here, so relocating consoleWorkingDirectory cannot move
  ## the paths the server resolves relative to it (config/, backups/).
  installDirectory: "/home/arcadedb"
  ## @param arcadedb.consoleWorkingDirectory Writable directory used as the JVM
  ## working directory by interactive tools started inside the pod, notably
  ## bin/console.sh. JLine writes the console history to <dir>/.history, which
  ## fails on the read-only root filesystem when it lands in installDirectory.
  ## Delivered through the ARCADEDB_SETTINGS environment variable, so it must be
  ## backed by a writable volume: it defaults to the arcadedb-tmp emptyDir mounted
  ## at /tmp. Set to "" to opt out.
  consoleWorkingDirectory: "/tmp"
  ## @param arcadedb.tmpDirectory Writable directory for the server PID file
  ## (ARCADEDB_PID) and XDG_CACHE_HOME. Must be backed by a writable volume
  ## (defaults to the arcadedb-tmp emptyDir). Set to "" to keep the image defaults.
  tmpDirectory: "/tmp"

  ## @section arcadedb.ha
  ha:
    ## @param arcadedb.ha.raftStorageDirectory Parent directory for the per-node
    ## raft-storage-<node> folders, mounted from the arcadedb-raft volume (a PVC
    ## when persistence.raft.enabled, else an emptyDir). Only used when HA is
    ## active (replicaCount > 1 or autoscaling enabled).
    raftStorageDirectory: "/home/arcadedb/raft"

  ## @section arcadedb.credentials
  credentials:
    rootPassword:
      ## If secret.name is null a random 32-char secret named 'arcadedb-credentials-secret' is
      ## auto-generated. NOTE: helm template (e.g. ArgoCD) regenerates the secret each render.
      ## For GitOps workflows supply your own secret and set name + key.
      secret:
        ## @param arcadedb.credentials.rootPassword.secret.name Existing secret name (null = auto-generate)
        name: null
        ## @param arcadedb.credentials.rootPassword.secret.key Key inside the existing secret
        key: null
    ## Shared secret the HA nodes authenticate each other with (forwarded commands, Raft
    ## group changes). Without it every node derives the token from the root password and
    ## the cluster name with a fixed public salt, so a weak root password makes it guessable
    ## and it cannot be rotated on its own. With the auto-generated root password secret a
    ## random 64-char `clusterToken` key is added to 'arcadedb-credentials-secret' and kept
    ## across upgrades. With a user-supplied root password secret this is opt-in: set
    ## secret.name (and key) to a Secret holding the token, e.g.
    ##   kubectl create secret generic arcadedb-cluster-token \
    ##     --from-literal=clusterToken="$(openssl rand -hex 32)"
    ## Only mounted when HA is active (replicaCount > 1 or autoscaling enabled).
    clusterToken:
      secret:
        ## @param arcadedb.credentials.clusterToken.secret.name Existing secret holding the HA cluster token (null = the generated key in 'arcadedb-credentials-secret', or none when rootPassword.secret.name is set)
        name: null
        ## @param arcadedb.credentials.clusterToken.secret.key Key inside the existing secret (null = clusterToken)
        key: null
    ## @param arcadedb.credentials.mountPath Directory the root password and cluster token
    ## are mounted at as files. The server reads them through arcadedb.server.rootPasswordPath
    ## and arcadedb.ha.clusterTokenPath, so neither appears in the process arguments.
    mountPath: /etc/arcadedb/secrets

  ## @section arcadedb.plugins
  ## Uncomment and configure to enable wire-protocol plugins.
  plugins: {}
    # bolt:
    #   enabled: true
    #   port: 7687
    # gremlin:
    #   enabled: true
    #   port: 8182
    # postgres:
    #   enabled: true
    #   port: 5432
    # mongo:
    #   enabled: false
    #   port: 27017
    # redis:
    #   enabled: false
    #   port: 6379
    # prometheus:
    #   enabled: false
    #   # Set false to allow unauthenticated scraping of /prometheus (needed for
    #   # ServiceMonitor / annotation-based discovery without basic auth).
    #   requireAuthentication: true
    ## Custom plugin example:
    # myPlugin:
    #   enabled: true
    #   port: 1234
    #   class: com.example.MyPlugin
    ## Custom plugin that listens on no port (set port: false instead of a dummy value):
    # myPortlessPlugin:
    #   enabled: true
    #   port: false
    #   class: com.example.MyPortlessPlugin

## @section image
image:
  ## @param image.registry Container registry
  registry: arcadedata
  ## @param image.repository Image repository
  repository: arcadedb
  ## @param image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent
  ## @param image.tag Image tag. Defaults to chart appVersion (with a -native suffix when image.flavor=native).
  tag: ""
  ## @param image.flavor Image flavor: "jvm" (default) or "native" (experimental GraalVM native binary).
  ## The native image has no shell, so the chart starts bin/arcadedb directly instead of bin/server.sh.
  ## It bundles no Gremlin and cannot load custom plugin classes; enabling either fails the render.
  ## Environment variables read by server.sh (JAVA_OPTS, ARCADEDB_OPTS_MEMORY, ARCADEDB_SETTINGS)
  ## have no effect on it: pass heap flags such as -Xmx2g through arcadedb.extraCommands instead.
  ## When setting image.tag yourself, pick the flavor that matches it.
  flavor: jvm

## @param imagePullSecrets Secrets for pulling from private registries
imagePullSecrets: []
## @param nameOverride Override chart name
nameOverride: ""
## @param fullnameOverride Override fully-qualified app name
fullnameOverride: ""

## @section serviceAccount
serviceAccount:
  ## @param serviceAccount.create Create a ServiceAccount
  create: true
  ## @param serviceAccount.automount Mount the ServiceAccount token into pods.
  ## ArcadeDB does not call the Kubernetes API - keep false.
  automount: false
  ## @param serviceAccount.annotations Annotations for the ServiceAccount
  annotations: {}
  ## @param serviceAccount.name ServiceAccount name. Auto-generated when empty.
  name: ""

## @param podAnnotations Annotations added to every pod
podAnnotations: {}
## @param podLabels Labels added to every pod
podLabels: {}

## @param podSecurityContext Pod-level security context.
## UID/GID 1000 matches the 'arcadedb' user created in the Docker image.
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

## @param securityContext Container-level security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  ## readOnlyRootFilesystem hardens the container; the chart provides writable
  ## emptyDir mounts for logs and /tmp, and PVCs (or, when persistence.* is
  ## disabled, emptyDirs) for the database, config and Raft directories.
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

## @section service
service:
  ## @section service.http
  http:
    ## @param service.http.type Service type. Use LoadBalancer or configure ingress for external access.
    type: ClusterIP
    ## @param service.http.port HTTP / Studio port
    port: 2480
  ## @section service.https
  https:
    ## @param service.https.port HTTPS / Studio port
    port: 2490
  ## @section service.rpc
  rpc:
    ## @param service.rpc.port Raft gRPC port (new ha-raft subsystem). Was 2424 in old binary-protocol HA.
    port: 2434
  ## @section service.external
  external:
    ## @param service.external.enabled Expose all protocol ports externally. Use instead of http.type
    enabled: false
    ## @param service.external.type External service type
    type: LoadBalancer

## @param statefulSetAnnotations Annotations added to the statefulset
statefulSetAnnotations: {}

## @param statefulSetLabels Labels added to the statefulset
statefulSetLabels: {}

## @section tls
tls:
  ## @param tls.enabled Enable TLS
  enabled: false

  ## @param tls.bolt Bolt TLS mode when the bolt plugin is enabled: DISABLED, OPTIONAL or REQUIRED
  bolt: OPTIONAL

  ## @param tls.postgres Postgres TLS mode when the postgres plugin is enabled: DISABLED, OPTIONAL or REQUIRED.
  ## Defaults to DISABLED, the server default, so enabling tls does not change existing Postgres clients.
  postgres: DISABLED

  ## @param tls.mountPath Path where TLS certificates are mounted in the container.
  mountPath: /etc/certs/arcadedb

  ## @section tls.secretRef
  secretRef:
    ## @param tls.secretRef.name Name of the secret containing TLS certificates ("" = <fullname>-tls)
    name: ""

    ## @section tls.secretRef.passwordSecret
    ## Secret holding the key store / trust store password. When name is empty the
    ## root password secret is used. Injected through the arcadedb.ssl.keyStorePassword /
    ## arcadedb.ssl.trustStorePassword env vars, never inlined or put on the command line.
    passwordSecret:
      ## @param tls.secretRef.passwordSecret.name Secret name ("" = root password secret)
      name: ""
      ## @param tls.secretRef.passwordSecret.key Key inside the secret
      key: ""

    ## @section tls.secretRef.keyStore
    keyStore:
      ## @param tls.secretRef.keyStore.key Key in the secret containing the key store
      key: keystore.p12

    ## @section tls.secretRef.trustStore
    trustStore:
      ## @param tls.secretRef.trustStore.format Override the trust store default format (JKS) by setting `javax.net.ssl.trustStoreType` (e.g. PKCS12)
      format: JKS
      ## @param tls.secretRef.trustStore.key Key in the secret containing the trust store
      key: truststore.jks

  ## @section tls.certManager
  certManager:
    ## @param tls.certManager.enabled Generate and manage TLS certificates using cert-manager
    enabled: false

    ## @param tls.certManager.extraDnsNames Adds extra DNS names to the TLS certificate
    ## (the services and pod FQDNs are always included)
    extraDnsNames: []

    ## @param tls.certManager.issuerProvidesCA Set false when the issuer does not
    ## return a ca.crt (e.g. ACME): cert-manager then writes no truststore.p12, so
    ## the key store is used as the trust store instead.
    issuerProvidesCA: true

    ## @section tls.certManager.issuerRef
    issuerRef:
      ## @param tls.certManager.issuerRef.kind Kind of the cert-manager issuer
      kind: ClusterIssuer
      ## @param tls.certManager.issuerRef.name Name of the cert-manager issuer
      name: ""

## @section ingress
ingress:
  ## @param ingress.enabled Enable Ingress
  enabled: false
  ## @param ingress.className IngressClass name
  className: ""
  ## @param ingress.annotations Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  ## @section ingress.hosts
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  ## @param ingress.tls TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

## @param resources Resource requests and limits.
## Commented out by default for dev/Minikube compatibility.
## Tune and uncomment for production.
resources: {}
# resources:
#   requests:
#     cpu: 500m
#     memory: 2Gi    # matches -Xms2G set by ARCADEDB_OPTS_MEMORY in the Docker image
#   limits:
#     memory: 4Gi    # no CPU limit - avoids throttling JVM GC pauses

## @section livenessProbe
## Liveness uses the dependency-free /api/v1/health endpoint (no DB I/O,
## never returns 503). Requires ArcadeDB 26.7.1+.
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http

## @section readinessProbe
readinessProbe:
  httpGet:
    path: /api/v1/ready
    port: http

## @section autoscaling
autoscaling:
  ## @param autoscaling.enabled Enable HorizontalPodAutoscaler.
  ## When enabled, the HA server list is pre-sized to maxReplicas so KubernetesAutoJoin
  ## can add pods dynamically. minReplicas must satisfy Raft quorum: >= floor(maxReplicas/2)+1.
  enabled: false
  ## @param autoscaling.minReplicas Minimum replicas. Must satisfy Raft quorum when HA is active.
  minReplicas: 1
  ## @param autoscaling.maxReplicas Maximum replicas
  maxReplicas: 5
  ## @param autoscaling.targetCPUUtilizationPercentage Target CPU utilization
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

## @section persistence
## The chart generates a per-replica volumeClaimTemplates entry for each enabled
## directory below and drops any emptyDir of the same name from `volumes`. A
## directory you back yourself (a `volumeClaimTemplates` entry of the same name, or
## a non-emptyDir `volumes` entry) is left alone. Disabled directories fall back to
## an emptyDir, and NOTES.txt warns that their content is lost on pod restart.
## NOTE: a StatefulSet's volumeClaimTemplates cannot change after creation, so
## toggling these flags (or HA, for Raft) on an installed release needs the
## StatefulSet recreated - see "Upgrading" in the chart README.
persistence:
  ## @param persistence.enabled Persist the database directory (arcadedb-data) with a PVC.
  ## Set to false only for ephemeral/dev deployments - all data is lost on pod restart.
  enabled: true
  ## @param persistence.size PVC size
  size: 8Gi
  ## @param persistence.accessMode PVC access mode
  accessMode: ReadWriteOnce
  ## @param persistence.storageClass StorageClass name. Empty = cluster default.
  storageClass: ""

  ## @section persistence.config
  ## Persist the config directory (users, groups, API tokens, server settings).
  ## Without this, configured users and tokens are lost on pod restart.
  ## HA: a persisted config directory relies on observability.health.readinessRequiresHA
  ## (on by default whenever HA is active). With it, a restarted node reports Ready only
  ## once it has rejoined the Raft group and caught up, so a rolling update cannot move
  ## on to the next pod and drop the write quorum (ArcadeData/arcadedb#10536). Turning
  ## readinessRequiresHA off on an HA cluster makes NOTES.txt print a warning.
  config:
    ## @param persistence.config.enabled Persist the config directory (arcadedb-config) with a separate PVC.
    enabled: true
    ## @param persistence.config.size PVC size for the config directory
    size: 1Gi
    ## @param persistence.config.accessMode PVC access mode for config
    accessMode: ReadWriteOnce
    ## @param persistence.config.storageClass StorageClass name for config PVC. Empty = cluster default.
    storageClass: ""

  ## @section persistence.raft
  ## Persist the Raft log and snapshots (arcadedb.ha.raftStorageDirectory). Only
  ## rendered while HA is active; a single node keeps an unused emptyDir. Without
  ## it, a restarted HA node rejoins with an empty log and must be re-synced.
  raft:
    ## @param persistence.raft.enabled Persist the Raft directory (arcadedb-raft) with a PVC when HA is active.
    enabled: true
    ## @param persistence.raft.size PVC size for the Raft directory
    size: 1Gi
    ## @param persistence.raft.accessMode PVC access mode for Raft
    accessMode: ReadWriteOnce
    ## @param persistence.raft.storageClass StorageClass name for the Raft PVC. Empty = cluster default.
    storageClass: ""

  ## @section persistence.backups
  ## Where arcadedb.backupDirectory lives. Off by default: backups then go to a
  ## "backups" subPath of the arcadedb-tmp emptyDir, writable under the read-only
  ## root filesystem but lost with the pod. Enabled, the chart generates a
  ## per-replica arcadedb-backups PVC and mounts it at arcadedb.backupDirectory.
  ## A volumeMounts entry that already covers arcadedb.backupDirectory wins over both.
  backups:
    ## @param persistence.backups.enabled Persist arcadedb.backupDirectory (arcadedb-backups) with a PVC.
    enabled: false
    ## @param persistence.backups.size PVC size for the backups
    size: 8Gi
    ## @param persistence.backups.accessMode PVC access mode for the backups
    accessMode: ReadWriteOnce
    ## @param persistence.backups.storageClass StorageClass name for the backups PVC. Empty = cluster default.
    storageClass: ""

## @param volumeMounts Pod volume mounts, rendered verbatim. Defaults mount the
## reserved arcadedb-* volumes at the server's data / config / log / tmp / raft
## directories. Keep names in sync with `volumes` / `volumeClaimTemplates`, and the
## paths in sync with arcadedb.databaseDirectory / configDirectory / logsDirectory /
## ha.raftStorageDirectory if you change those.
volumeMounts:
  - name: arcadedb-data
    mountPath: /home/arcadedb/databases
  - name: arcadedb-config
    mountPath: /home/arcadedb/config
  - name: arcadedb-logs
    mountPath: /home/arcadedb/log
  - name: arcadedb-tmp
    mountPath: /tmp
  - name: arcadedb-raft
    mountPath: /home/arcadedb/raft

## @param volumes Pod volumes. Defaults back logs and /tmp with an emptyDir. The
## arcadedb-data / arcadedb-config / arcadedb-raft volumes come from `persistence`
## (a generated PVC, or an emptyDir when disabled), so they need no entry here. An
## entry for one of those names that is not an emptyDir (e.g. hostPath, an existing
## persistentVolumeClaim) replaces the chart's backing for it; an emptyDir entry is
## dropped while the matching persistence flag is on.
volumes:
  - name: arcadedb-logs
    emptyDir: {}
  - name: arcadedb-tmp
    emptyDir: {}

## @param volumeClaimTemplates Extra StatefulSet per-replica PVCs, rendered verbatim
## after the ones generated from `persistence`. An entry named arcadedb-data /
## arcadedb-config / arcadedb-raft replaces the generated claim for that directory;
## add your own names for replication or other data (with a matching volumeMounts
## entry). An entry named arcadedb-backups is mounted at arcadedb.backupDirectory.
volumeClaimTemplates: []
# - metadata:
#     name: arcadedb-data
#   spec:
#     accessModes:
#       - ReadWriteOnce
#     resources:
#       requests:
#         storage: 8Gi

## @section initContainers Configuration for init containers
initContainers:
  ## @section initContainers.configDirectory
  ## When the config directory lives on a persistent volume, Kubernetes can create it as root
  ## (for example while mounting backup.json / mcp-config.json into it), and ArcadeDB then
  ## cannot write users or settings. Setting volumeName and mountPath adds a config-chown init
  ## container that creates arcadedb.configDirectory on that volume if needed and chowns it to
  ## securityContext.runAsUser:runAsGroup. It runs as root with only CHOWN and DAC_OVERRIDE.
  configDirectory:
    ## @param initContainers.configDirectory.volumeName Name of the volume holding the config directory (e.g. a volumeClaimTemplates entry). Empty = no config-chown container.
    volumeName: ""
    ## @param initContainers.configDirectory.mountPath Path that volume is mounted at in the ArcadeDB container. Must be arcadedb.configDirectory or one of its parents.
    mountPath: ""
    image:
      ## @param initContainers.configDirectory.image.registry Registry for the config-chown image
      registry: docker.io
      ## @param initContainers.configDirectory.image.repository Repository for the config-chown image
      repository: library/busybox
      ## @param initContainers.configDirectory.image.tag Tag for the config-chown image
      tag: "1.37.0"
      ## @param initContainers.configDirectory.image.pullPolicy Pull policy for the config-chown image
      pullPolicy: IfNotPresent
  ## @section initContainers.configSeed
  ## The volume at arcadedb.configDirectory hides the files the image ships in
  ## <installDirectory>/config. Without server-groups.json the server uses a
  ## built-in default that lacks the "readonly" group; without gremlin-server.yaml
  ## (and its .properties / .groovy) the Gremlin plugin starts from an empty
  ## configuration. The config-seed init container runs the server image, with the
  ## config volume mounted elsewhere so the image's files stay visible, and copies
  ## each of those files that the config directory does not hold yet. Files already
  ## there are never overwritten. Skipped when no volumeMounts entry holds
  ## arcadedb.configDirectory. Runs after config-chown.
  ## The native image (image.flavor=native) has no shell, so there config-seed runs
  ## the JVM image of the same version instead: the server tag without its -native
  ## suffix (an extra image pull per node). With an image.tag that does not end in
  ## -native, set image.tag below, or the render fails.
  configSeed:
    ## @param initContainers.configSeed.enabled Seed missing default config files from the server image
    enabled: true
    image:
      ## @param initContainers.configSeed.image.registry Registry for the config-seed image. Empty = image.registry
      registry: ""
      ## @param initContainers.configSeed.image.repository Repository for the config-seed image. Empty = image.repository
      repository: ""
      ## @param initContainers.configSeed.image.tag Tag for the config-seed image. Empty = the server tag (without -native on the native flavor)
      tag: ""
  ## @param initContainers.otherContainers Additional init containers, rendered verbatim after config-chown and config-seed
  otherContainers: []

## @param nodeSelector Node selector
nodeSelector: {}

## @param tolerations Tolerations
tolerations: []

## @section affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - arcadedb
          topologyKey: kubernetes.io/hostname

## @param extraManifests Arbitrary extra Kubernetes manifests to include
extraManifests: {}

## @section networkPolicy
networkPolicy:
  ## @param networkPolicy.enabled Create NetworkPolicy resources.
  ## When enabled: HTTP (2480), HTTPS (when TLS is on) and enabled plugin ports are open to
  ## all cluster pods; Raft gRPC (2434) is restricted to ArcadeDB pods only. Recommended for
  ## production multi-tenant clusters.
  enabled: false

## @section observability
## Observability (ArcadeDB 26.7.1+). Every knob below defaults off, except
## health.readinessRequiresHA, which follows HA (on whenever HA is active).
observability:
  ## @section observability.metrics
  metrics:
    prometheus:
      ## Prometheus Operator ServiceMonitor. Requires the prometheus plugin
      ## (arcadedb.plugins.prometheus.enabled=true) so /prometheus is served.
      serviceMonitor:
        ## @param observability.metrics.prometheus.serviceMonitor.enabled Create a ServiceMonitor CRD
        enabled: false
        ## @param observability.metrics.prometheus.serviceMonitor.interval Scrape interval
        interval: 30s
        ## @param observability.metrics.prometheus.serviceMonitor.scrapeTimeout Scrape timeout (empty = Prometheus default)
        scrapeTimeout: ""
        ## @param observability.metrics.prometheus.serviceMonitor.path Metrics path
        path: /prometheus
        ## @param observability.metrics.prometheus.serviceMonitor.labels Extra labels (e.g. release: kube-prometheus-stack)
        labels: {}
        ## @param observability.metrics.prometheus.serviceMonitor.annotations Extra annotations
        annotations: {}
        ## @param observability.metrics.prometheus.serviceMonitor.relabelings Prometheus relabelings
        relabelings: []
        ## @param observability.metrics.prometheus.serviceMonitor.metricRelabelings Prometheus metric relabelings
        metricRelabelings: []
        basicAuth:
          ## @param observability.metrics.prometheus.serviceMonitor.basicAuth.enabled Scrape with basic auth
          enabled: false
          ## @param observability.metrics.prometheus.serviceMonitor.basicAuth.secretName Secret holding scrape credentials (username + password keys)
          secretName: ""
          ## @param observability.metrics.prometheus.serviceMonitor.basicAuth.usernameKey Key in the secret holding the username
          usernameKey: username
          ## @param observability.metrics.prometheus.serviceMonitor.basicAuth.passwordKey Key in the secret holding the password
          passwordKey: password
      ## Annotation-based discovery (classic Prometheus, no Operator).
      podAnnotations:
        ## @param observability.metrics.prometheus.podAnnotations.enabled Add prometheus.io/* scrape annotations to pods
        enabled: false
        ## @param observability.metrics.prometheus.podAnnotations.path Scrape path annotation value
        path: /prometheus
        ## @param observability.metrics.prometheus.podAnnotations.port Scrape port (empty = service.http.port)
        port: ""
    ## Push metrics to an OpenTelemetry collector alongside /prometheus.
    otlp:
      ## @param observability.metrics.otlp.enabled Enable the OTLP metrics registry
      enabled: false
      ## @param observability.metrics.otlp.endpoint OTLP/http metrics endpoint
      endpoint: http://localhost:4318/v1/metrics
  ## @section observability.tracing
  tracing:
    ## @param observability.tracing.enabled Enable distributed tracing (plugin ships in the standard image)
    enabled: false
    ## @param observability.tracing.endpoint OTLP/gRPC trace endpoint
    endpoint: http://localhost:4317
    ## @param observability.tracing.samplingRate Parent-based sampling ratio [0.0, 1.0]
    samplingRate: 0.0
  ## @section observability.logging
  logging:
    ## @param observability.logging.format Log format: text or json
    format: text
    ## @param observability.logging.includeTrace Append [traceId=…] to text logs while a trace is active
    includeTrace: false
  ## @section observability.health
  health:
    ## @param observability.health.readinessRequiresHA /api/v1/ready waits until the node has
    ## joined the Raft group and caught up, so a rolling restart cannot drop the write quorum.
    ## null (default) = on whenever HA is active (replicaCount > 1 or autoscaling), off on a
    ## single node. An explicit true or false always wins. Persisting the config directory on
    ## an HA cluster relies on it: see persistence.config.
    readinessRequiresHA: null
    ## @param observability.health.readinessHAMaxLag Max Raft log entries a follower may lag behind commit index and still report Ready (requires readinessRequiresHA)
    readinessHAMaxLag: 100
